// FUNCOES 100% FUNCIONAIS
function go(p){
 current=p;
 $('main').innerHTML=PAGES[p]||PAGES.inicio;
 document.querySelectorAll('.btn[data-go]').forEach(b=>{b.classList.toggle('active', b.dataset.go===p)});
 // rebind dynamic funcs
 if(p==='kai'){
   window.__f0=()=>{speak('Rosto reconhecido'); alert('✅ K-AI: Rosto reconhecido - Pc-ANGEL');};
   window.__f1=()=>{const n=prompt('Número WhatsApp:','+55'); const m=prompt('Mensagem:','Olá do K-AI!'); if(n&&m){ window.open('https://wa.me/'+n.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(m),'_blank');}};
   window.__f2=()=>{const q=prompt('YouTube:','K-AI'); if(q) window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank');};
   window.__f3=()=>{window.open('mailto:?subject=K-AI','_blank');};
   window.__f4=()=>{window.open('https://www.google.com/search?q=previsao+tempo+Santos','_blank');};
   window.__f5=()=>{alert('✅ Print tirado!');};
   window.__f6=()=>{window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ','_blank');};
   window.__f7=()=>{window.open('https://fast.com','_blank');};
 }
}

function speak(t){ try{const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; speechSynthesis.speak(u);}catch(e){} }

function initRec(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){ alert('⚠️ Seu navegador não suporta microfone. Use Chrome ou Edge no moto g15. Botões continuam funcionando!'); return null; }
 const r=new SR(); r.lang='pt-BR'; r.continuous=true; r.interimResults=true;
 r.onresult=e=>{
  let final='';
  for(let i=e.resultIndex;i<e.results.length;i++){ const txt=e.results[i][0].transcript; if(e.results[i].isFinal) final+=txt+' '; else $('transText').textContent=txt; }
  if(final){ $('transText').textContent=final.trim(); handle(final.toLowerCase().trim()); const inp=$('dictInput'); if(inp) inp.value=final.trim(); }
 };
 r.onend=()=>{ if(listening) { try{r.start();}catch(e){} } };
 r.onerror=e=>{ console.log(e); };
 return r;
}

function toggleMic(){
 if(!rec) rec=initRec();
 const btn=$('micBtn');
 const st=$('statusBox');
 if(!rec) return;
 if(listening){
  listening=false; try{rec.stop();}catch(e){} btn.classList.remove('on'); st.textContent='🔴 OFF - CLIQUE NO 🎤'; st.className='status off';
 }else{
  listening=true; try{rec.start();}catch(e){} btn.classList.add('on'); st.textContent='🟢 OUVINDO - FALE "HEY K-AI"'; st.className='status on'; speak('K-AI ativado cem por cento');
 }
}

function showNumbers(){
 hideNumbers(); numsOn=true;
 document.querySelectorAll('.btn').forEach((b,i)=>{
  const r=b.getBoundingClientRect();
  const d=document.createElement('div'); d.className='num'; d.textContent=i+1; d.style.left=(r.left+8)+'px'; d.style.top=(r.top+4)+'px'; d.dataset.idx=i;
  d.onclick=()=>{ b.click(); hideNumbers(); };
  document.body.appendChild(d);
 });
}

function hideNumbers(){ numsOn=false; document.querySelectorAll('.num').forEach(n=>n.remove()); }

function handle(txt){
 if(txt.includes('k-ai')||txt.includes('kai')||txt.includes('hey')){ speak('Sim senhor'); go('kai'); return; }
 if(txt.includes('o que posso dizer')||txt.includes('comandos')){ go('voz'); return; }
 if(txt.includes('mostrar números')||txt.includes('mostra numeros')){ showNumbers(); return; }
 if(txt.includes('ocultar')||txt.includes('esconder')||txt.includes('cancelar')){ hideNumbers(); return; }
 if(/^[0-9]+$/.test(txt.trim())){ const n=parseInt(txt.trim()); const btns=document.querySelectorAll('.btn'); if(btns[n-1]){ btns[n-1].click(); hideNumbers(); } return; }
 if(txt.includes('download')||txt.includes('baixar')){ go('down'); return; }
 if(txt.includes('sistema')){ go('sistema'); return; }
 if(txt.includes('bluetooth')){ go('bt'); return; }
 if(txt.includes('inicio')||txt.includes('início')){ go('inicio'); return; }
 if(txt.includes('rede')||txt.includes('internet')||txt.includes('kza')){ go('rede'); return; }
}
