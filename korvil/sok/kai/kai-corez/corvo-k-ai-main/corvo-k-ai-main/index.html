<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-AI KORVIL v-9100</title>
<style>
:root{--ciano:#00FFFF;--preto:#000;--preto2:#0a0a0a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--preto);color:var(--ciano);font-family:'Consolas','Courier New',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{width:100%;max-width:900px;background:var(--preto2);border:1px solid var(--ciano);border-radius:12px;box-shadow:0 0 30px var(--ciano);padding:20px;text-align:center}
.glow{text-shadow:0 0 8px var(--ciano)}
#avatar{width:120px;height:120px;border-radius:50%;border:2px solid var(--ciano);box-shadow:0 0 25px var(--ciano);animation:pulse 2.5s infinite;margin-bottom:10px}
@keyframes pulse{0%{box-shadow:0 0 15px var(--ciano)}50%{box-shadow:0 0 35px var(--ciano)}100%{box-shadow:0 0 15px var(--ciano)}}
h1{font-size:28px;margin-bottom:5px}
.sub{opacity:0.6;font-size:12px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
button{padding:14px;background:var(--ciano);color:var(--preto);border:0;font-weight:900;border-radius:8px;cursor:pointer;transition:0.2s;font-size:14px}
button:hover{background:#FFF;transform:translateY(-2px)}
button:active{transform:scale(0.95)}
#mic.gravando{background:#FF0044;color:#FFF}
input{grid-column:1/3;padding:12px;width:100%;background:#111;color:var(--ciano);border:1px solid var(--ciano);border-radius:8px;font-size:15px;outline:none}
#log{text-align:left;margin-top:15px;background:#000;padding:12px;height:280px;overflow-y:scroll;border:1px solid var(--ciano);border-radius:8px;font-size:12px}
#log::-webkit-scrollbar{width:5px}#log::-webkit-scrollbar-thumb{background:var(--ciano)}
</style>
</head>
<body>
<div class="container">
  <img id="avatar" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..." alt="K-AI">
  <h1 class="glow">K-AI KORVIL v-9100</h1>
  <p class="sub glow">SISTEMA AUTÔNOMO // K-RIADOR</p>

  <div class="grid">
    <button onclick="lerPasta()">1. LER PASTA</button>
    <button id="mic">🎤 SEGURE E FALE</button>
    <button onclick="enviar()">3. EXECUTAR</button>
    <button onclick="baixarCodigo()">4. BAIXAR CÓDIGO</button>
    <input id="comando" placeholder="KAI: crie calculadora">
  </div>

  <div id="log">> K-AI ONLINE. CLIQUE EM LER PASTA PARA INICIAR...<br></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const REPO = "korvilp-sudo/korvil-app";
const PATH = "corvo-k-ai-main/corvo-k-ai-main";
let CEREBRO = {};

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'pt-BR'; recognition.continuous = false;

const btnMic = document.getElementById('mic');
btnMic.onmousedown=()=>{recognition.start(); btnMic.classList.add('gravando'); btnMic.innerText='🔴 GRAVANDO...'};
btnMic.onmouseup=()=>{recognition.stop(); btnMic.classList.remove('gravando'); btnMic.innerText='🎤 SEGURE E FALE'};

recognition.onresult = e => {
  let texto = e.results[0][0].transcript;
  if(!texto.toLowerCase().startsWith('kai')) texto = 'KAI: ' + texto;
  document.getElementById('comando').value = texto;
  log('VOZ: ' + texto)
}

function log(t){
  document.getElementById('log').innerHTML += "> " + t + '<br>';
  document.getElementById('log').scrollTop = 99999
}

async function lerPasta(){
  log('CONECTANDO AO CEREBRO...');
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}`);
  const arquivos = await res.json(); CEREBRO = {};
  for(const file of arquivos){
    if(file.name.match(/\.(html|js|css|png|json|md)$/)){
      CEREBRO[file.name] = await fetch(file.download_url).then(r=>r.text());
    }
  }
  log(`CEREBRO SINCRONIZADO. ${Object.keys(CEREBRO).length} ARQUIVOS`);
}

async function enviar(){
  if(Object.keys(CEREBRO).length === 0) return alert('ERRO: SINCRONIZE O CEREBRO PRIMEIRO');
  const comando = document.getElementById('comando').value;
  log('ENVIANDO ORDEM PARA O BACKEND...');
  await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/kai-backend.yml/dispatches`, {
    method: 'POST',
    headers: {'Accept': 'application/vnd.github.v3+json'},
    body: JSON.stringify({ref: 'main', inputs: {comando: comando, contexto: JSON.stringify(CEREBRO).slice(0,12000)}})
  });
  log('✅ ORDEM ENVIADA. AGUARDE 40S E DE F5');
}

function baixarCodigo(){
  if(Object.keys(CEREBRO).length === 0) return alert('ERRO: SINCRONIZE O CEREBRO PRIMEIRO');
  log('GERANDO PACOTE ZIP...');
  const zip = new JSZip(); const folder = zip.folder("K-AI-KORVIL");
  for(const nome in CEREBRO){ folder.file(nome, CEREBRO[nome]); }
  zip.generateAsync({type:"blob"}).then(function(content) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = "K-AI-KORVIL.zip"; link.click();
    log('✅ PACOTE BAIXADO');
  });
}
</script>
</body></html>
