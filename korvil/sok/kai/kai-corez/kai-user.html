<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-AI | ASSISTENTE KORVIL</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --c: #00FFFF;
      --c2: #A8FFE6;
      --bg: #000000;
      --panel: rgba(0, 0, 0, 0.75);
      --border: #00FFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
    body { background: var(--bg); overflow: hidden; color: var(--c); height: 100vh; }

    #canvas3d { position: fixed; inset: 0; z-index: 0; opacity: 0.8; }
    .ui { position: fixed; z-index: 10; pointer-events: none; }

    /* HUD TOP */
    .logo { top: 25px; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 20px var(--c); text-align: center; }
    .logo span { color: var(--c2); font-size: 11px; letter-spacing: 2px; display: block; margin-top: 4px; }
    .modo { top: 25px; right: 20px; font-size: 11px; font-weight: 900; padding: 8px 14px; border: 1px solid var(--c); border-radius: 20px; background: rgba(0, 255, 255, 0.1); box-shadow: 0 0 10px var(--c); pointer-events: auto; }

    /* ÁREA DE INTERAÇÃO */
    .interaction-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 650px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 12px; }

    /* CHAT BOX */
    .chat { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 15px; max-height: 220px; overflow-y: auto; backdrop-filter: blur(12px); box-shadow: 0 0 15px rgba(0, 255, 255, 0.15); pointer-events: auto; }
    .msg { margin: 8px 0; font-size: 13px; line-height: 1.5; }
    .msg.user { color: var(--c2); text-align: right; }
    .msg.kai { color: var(--c); text-align: left; }

    /* INPUT & BOTOES */
    .input-bar { width: 100%; display: flex; gap: 10px; align-items: center; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--border); border-radius: 30px; padding: 8px 15px; backdrop-filter: blur(10px); pointer-events: auto; box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); }
    .input-bar input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; padding: 6px; }
    .input-bar input::placeholder { color: rgba(0, 255, 255, 0.4); }

    .btn-send { background: transparent; border: none; color: var(--c); font-size: 18px; cursor: pointer; padding: 0 8px; transition: 0.2s; }
    .btn-send:hover { color: var(--c2); transform: scale(1.15); }

    /* MIC BUTTON */
    .mic { width: 60px; height: 60px; border: 2px solid var(--c); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; pointer-events: auto; transition: .3s; box-shadow: 0 0 20px var(--c); background: rgba(0, 255, 255, 0.05); }
    .mic:hover { transform: scale(1.1); box-shadow: 0 0 35px var(--c); }
    .mic.listening { animation: pulse 0.8s infinite; background: rgba(0, 255, 255, 0.3); }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 20px var(--c); } 50% { box-shadow: 0 0 50px var(--c2); } }

    .status { font-size: 11px; text-align: center; color: var(--c2); letter-spacing: 1px; }
  </style>
</head>
<body>

  <!-- CANVAS 3D OCTAEDRO CORE -->
  <canvas id="canvas3d"></canvas>

  <!-- OVERLAY UI -->
  <div class="ui logo">K-AI<span>ASSISTENTE KORVIL</span></div>
  <div class="ui modo">MODO: VISITANTE</div>

  <div class="interaction-container">
    <div class="chat" id="chat"></div>

    <div class="input-bar">
      <input type="text" id="userInput" placeholder="Digite uma mensagem ou comando..." autocomplete="off">
      <button class="btn-send" id="sendBtn" title="Enviar">➔</button>
    </div>

    <div class="mic" id="micBtn" title="Clique para falar">🎙️</div>
    <div class="status" id="status">Como posso te ajudar?</div>
  </div>

  <audio id="bgMusic" loop></audio>

  <script>
    const chat = document.getElementById('chat');
    const statusEl = document.getElementById('status');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // ===== ENVIAR E PROCESSAR MENSAGENS =====
    async function enviarMensagem(texto) {
      const msgText = texto || userInput.value.trim();
      if (!msgText) return;

      addMsg('user', msgText);
      if (!texto) userInput.value = '';

      // Tenta enviar para a API local (server.js) ou processa localmente
      try {
        const res = await fetch('/api/kai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msgText })
        });

        if (res.ok) {
          const data = await res.json();
          falar(data.response);
        } else {
          processarComandoLocal(msgText.toLowerCase());
        }
      } catch (e) {
        processarComandoLocal(msgText.toLowerCase());
      }
    }

    function addMsg(tipo, texto) {
      const div = document.createElement('div');
      div.className = 'msg ' + tipo;
      div.innerText = tipo === 'user' ? 'Você: ' + texto : 'K-AI: ' + texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // ===== RECONHECIMENTO E SÍNTESE DE VOZ =====
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;
    let recognition;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        statusEl.innerText = 'Ouvindo...';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        statusEl.innerText = 'Toque para falar';
      };

      recognition.onresult = (e) => {
        const cmd = e.results[0][0].transcript;
        enviarMensagem(cmd);
      };
    }

    micBtn.onclick = () => {
      if (!isListening && recognition) recognition.start();
    };

    function falar(texto) {
      addMsg('kai', texto);
      if (!synth) return;
      synth.cancel();
      const utter = new SpeechSynthesisUtterance(texto);
      utter.lang = 'pt-BR';
      utter.rate = 1.0;
      utter.pitch = 1.0;
      synth.speak(utter);
    }

    // ===== CÉREBRO LOCAL (FALLBACK) =====
    function processarComandoLocal(cmd) {
      if (cmd.includes('olá') || cmd.includes('k-ai')) {
        falar('Olá! Sou o K-AI Assistente. Posso te ajudar a navegar no app KORVIL.');
      } else if (cmd.includes('horas')) {
        falar('Horário atual: ' + new Date().toLocaleTimeString('pt-BR'));
      } else if (cmd.includes('abrir app')) {
        falar('Abrindo aplicativo KORVIL');
        window.open('../index.html', '_blank');
      } else if (cmd.includes('planos')) {
        falar('Deseja ver os planos do Projeto Transformação?');
      } else if (cmd.includes('status')) {
        falar('Todos os sistemas KORVIL operando normalmente.');
      } else if (cmd.includes('editar') || cmd.includes('criar')) {
        falar('Acesso negado. Esse comando é exclusivo do Administrador KORVIL.');
      } else {
        falar('Posso te ajudar com: abrir app, ver planos, horários e status.');
      }
    }

    // EVENTOS DE ENVIO
    sendBtn.onclick = () => enviarMensagem();
    userInput.onkeypress = (e) => { if (e.key === 'Enter') enviarMensagem(); };

    // ===== 3D OCTAEDRO JARVIS CORE =====
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // OCTAEDRO CENTRAL (Substituiu a Esfera)
    const geometry = new THREE.OctahedronGeometry(1.6, 0);
    const material = new THREE.MeshPhongMaterial({
      color: 0x00FFFF,
      wireframe: true,
      emissive: 0x00FFFF,
      emissiveIntensity: 0.6
    });
    const nucleo = new THREE.Mesh(geometry, material);
    scene.add(nucleo);

    // OCTAEDRO INTERNO PEQUENO (Sombra/Núcleo)
    const geoInterno = new THREE.OctahedronGeometry(0.8, 0);
    const matInterno = new THREE.MeshBasicMaterial({ color: 0xA8FFE6, wireframe: true });
    const nucleoInterno = new THREE.Mesh(geoInterno, matInterno);
    scene.add(nucleoInterno);

    // ANÉIS
    const ringGeo = new THREE.TorusGeometry(2.6, 0.05, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00FFFF, wireframe: true });
    const ring1 = new THREE.Mesh(ringGeo, ringMat);
    const ring2 = new THREE.Mesh(ringGeo, ringMat);
    ring2.rotation.x = Math.PI / 2;
    scene.add(ring1, ring2);

    // ILUMINAÇÃO
    const light = new THREE.PointLight(0x00FFFF, 2, 50);
    light.position.set(5, 5, 5);
    scene.add(light);
    camera.position.z = 5.5;

    // PARTÍCULAS
    const particles = new THREE.Points(
      new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array(3000).fill().map(() => (Math.random() - 0.5) * 20), 3)),
      new THREE.PointsMaterial({ color: 0x00FFFF, size: 0.02 })
    );
    scene.add(particles);

    function animate() {
      requestAnimationFrame(animate);
      nucleo.rotation.x += 0.008;
      nucleo.rotation.y += 0.012;
      nucleoInterno.rotation.x -= 0.015;
      nucleoInterno.rotation.y -= 0.01;
      ring1.rotation.y += 0.015;
      ring2.rotation.z += 0.01;
      particles.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();

    // SETUP DE INICIALIZAÇÃO
    setTimeout(() => falar('K-AI Assistente online. Como posso te ajudar hoje?'), 1500);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
