<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-TP - PROJETO TRANSFORMAÇÃO 4D XL | CINEMA DUO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #020208;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    perspective: 1200px;
  }

  /* --- FUNDO VIVO ANIMADO 4D --- */
  .bg-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    overflow: hidden;
    z-index: 0;
    background: radial-gradient(circle at 50% 50%, #081026 0%, #000000 100%);
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.5;
    animation: floatOrb 12s ease-in-out infinite alternate;
  }
  .orb-1 { width: 50vw; height: 50vw; background: #00ffff; top: -20vw; left: -10vw; }
  .orb-2 { width: 45vw; height: 45vw; background: #0066ff; bottom: -15vw; right: -10vw; animation-delay: -6s; }
  .orb-3 { width: 35vw; height: 35vw; background: #ff0055; top: 30%; left: 30%; opacity: 0.25; animation-duration: 18s; }

  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 50px) scale(1.15); }
    100% { transform: translate(-60px, 80px) scale(0.9); }
  }

  .grid-3d {
    position: absolute;
    width: 200vw;
    height: 200vh;
    top: -50vh;
    left: -50vw;
    background-image: 
      linear-gradient(to right, rgba(0, 255, 255, 0.15) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(600px) rotateX(65deg) translateZ(0);
    animation: gridMove 8s linear infinite;
    transform-origin: center center;
  }

  @keyframes gridMove {
    0% { transform: perspective(600px) rotateX(65deg) translateY(0); }
    100% { transform: perspective(600px) rotateX(65deg) translateY(60px); }
  }

  .scanlines {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.6;
  }

  /* --- LOGO FIXA NO TOPO --- */
  .logo-wrapper {
    position: fixed;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    border: 2px solid rgba(0, 255, 255, 0.8);
    border-radius: 12px;
    background: rgba(4, 10, 24, 0.85);
    backdrop-filter: blur(16px);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), inset 0 0 15px rgba(0, 255, 255, 0.3);
    padding: 2px 10px;
  }
  
  .logo-top {
    width: 22vw;
    max-width: 260px;
    min-width: 160px;
    height: auto;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 0 15px #00ffff);
  }

  /* --- ÁREA CENTRAL DOS SLIDES --- */
  .slide {
    position: absolute;
    left: 0;
    width: 100%;
    top: 90px;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 6%;
    transform-style: preserve-3d;
    transform: translateZ(-300px) rotateY(90deg);
    opacity: 0;
    transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 10;
  }

  .slide.active { transform: translateZ(0) rotateY(0deg); opacity: 1; }
  .slide.exit { transform: translateZ(-300px) rotateY(-90deg); opacity: 0; }

  /* --- TIPOGRAFIA --- */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 5vw, 46px);
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 30%, #00ffff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(0,255,255,0.9));
    margin-bottom: 10px;
    position: relative;
    width: 100%;
    line-height: 1.15;
  }

  h1::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 20%;
    width: 60%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #00ffff, transparent);
    box-shadow: 0 0 15px #00ffff;
  }

  .sub-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 8px;
  }

  .sub-item {
    font-size: clamp(15px, 3.8vw, 30px);
    font-weight: 800;
    color: rgba(255,255,255,0.4);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    line-height: 1.2;
  }

  .sub-item.active {
    font-size: clamp(18px, 4.5vw, 36px);
    color: #00ffff;
    text-shadow: 0 0 25px #00ffff, 0 0 50px #00aaff;
    transform: scale(1.04) translateZ(20px);
  }

  /* --- TABELAS --- */
  table {
    border-collapse: separate;
    border-spacing: 0;
    margin: 8px auto;
    font-size: clamp(12px, 2.5vw, 20px);
    width: 95%;
    max-width: 1100px;
    background: rgba(0, 15, 30, 0.7);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    border: 2px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 30px rgba(0,255,255,0.2);
    overflow: hidden;
  }

  th, td { padding: 6px 10px; text-align: center; border-bottom: 1px solid rgba(0, 255, 255, 0.2); }
  th { background: rgba(0, 255, 255, 0.2); color: #00ffff; font-family: 'Orbitron'; font-size: clamp(13px, 3vw, 22px); letter-spacing: 1px; text-shadow: 0 0 15px #00ffff; }
  td { background: rgba(0, 0, 0, 0.5); color: #ffffff; font-weight: 700; }

  .destaque { color: #00ffff; font-weight: 900; text-shadow: 0 0 15px #00ffff; }
  .destaque-red { color: #ff0055; font-weight: 900; animation: alertNeon 0.8s infinite alternate; }

  @keyframes alertNeon {
    0% { text-shadow: 0 0 8px #ff0055; transform: scale(1); }
    100% { text-shadow: 0 0 30px #ff0055, 0 0 50px #ff0000; transform: scale(1.05); }
  }

  /* --- LEGENDA TIPO YOUTUBE / NETFLIX NO PLAYER --- */
  .cinema-legenda {
    position: fixed;
    bottom: 65px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.85);
    border: 1px solid rgba(0, 255, 255, 0.5);
    padding: 6px 16px;
    border-radius: 8px;
    z-index: 105;
    text-align: center;
    max-width: 90%;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
  }
  .cinema-legenda p {
    font-size: clamp(13px, 3vw, 18px);
    font-weight: 700;
    color: #FFD700;
    text-shadow: 1px 1px 3px #000;
    letter-spacing: 0.5px;
  }

  /* --- BARRA DE PROGRESSO E CONTROLES FIXOS --- */
  .progress { 
    position: fixed; 
    bottom: 52px; 
    left: 4%; 
    width: 92%; 
    height: 5px; 
    background: rgba(255,255,255,0.15); 
    border-radius: 10px; 
    z-index: 100; 
    overflow: hidden;
  }
  .progress-bar { 
    height: 100%; 
    background: linear-gradient(90deg, #00ffff, #00aaff, #ff0055); 
    box-shadow: 0 0 20px #00ffff; 
    width: 0%; 
  }

  .footer-controls {
    position: fixed;
    bottom: 8px;
    left: 0;
    width: 100%;
    padding: 0 4%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    z-index: 100;
    pointer-events: auto;
  }

  .nav-buttons { display: flex; gap: 6px; }

  .btn {
    padding: 6px 12px;
    font-size: clamp(10px, 2vw, 13px);
    font-family: 'Orbitron';
    background: rgba(0, 255, 255, 0.15);
    border: 2px solid #00ffff;
    border-radius: 20px;
    color: #00ffff;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .btn:hover { background: #00ffff; color: #000; box-shadow: 0 0 25px #00ffff; }

  .btn-participar {
    padding: 7px 16px;
    font-size: clamp(10px, 2.2vw, 15px);
    text-decoration: none;
    background: linear-gradient(90deg, #00ffff, #0088ff);
    color: #000;
    border: none;
    border-radius: 20px;
    font-weight: 900;
    font-family: 'Orbitron';
    box-shadow: 0 0 25px rgba(0,255,255,0.7);
    white-space: nowrap;
  }
  .btn-participar:hover { box-shadow: 0 0 35px #00ffff; }

  .counter { 
    position: fixed; 
    top: 15px; 
    right: 20px; 
    font-size: clamp(12px, 2vw, 16px); 
    color: #00ffff; 
    font-family: 'Orbitron'; 
    z-index: 100; 
    text-shadow: 0 0 12px #00ffff;
  }

  @keyframes load { from { width: 0%; } to { width: 100%; } }
</style>
</head>
<body>

<div class="bg-container">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-3d"></div>
  <div class="scanlines"></div>
</div>

<div class="logo-wrapper">
  <img src="sections/ktp/images/logoprojetotransformacao.png" 
       onerror="this.onerror=null; this.src='https://korvilp-sudo.github.io/korvil-app/sections/ktp/images/logoprojetotransformacao.png';" 
       alt="Logo K-TP Projeto Transformação" 
       class="logo-top">
</div>

<div class="counter" id="slideCounter">1 / 10</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<div id="slides"></div>

<div class="cinema-legenda">
  <p id="cinemaLegendaTexto">Carregando experiência cinematográfica K-TP...</p>
</div>

<div class="footer-controls">
  <div class="nav-buttons">
    <button class="btn" onclick="prevSlide()">◀ VOLTAR</button>
    <button class="btn" onclick="togglePlayPause()" id="btnPlayPause">⏸ PAUSAR</button>
    <button class="btn" onclick="nextSlide()">AVANÇAR ▶</button>
  </div>
  <button class="btn" onclick="toggleSom()" id="btnSom">🔊 SOM: LIGADO</button>
  <a href="https://korvilp-sudo.github.io/korvil-app/sections/ktp/projetotransformacao/index.html" target="_blank" class="btn-participar">QUERO PARTICIPAR</a>
</div>

<audio id="whoosh">
  <source src="https://cdn.pixabay.com/audio/2024/08/09/audio_8c8b2c5d5e.mp3" type="audio/mpeg">
</audio>

<script>
const slides = [
  { 
    t: "K-TP", 
    s: "TREINAMENTO PERSONALIZADO", 
    p: "<span class='destaque'>PROJETO TRANSFORMAÇÃO - 11° ANO</span><br>O MÉTODO CIENTÍFICO PARA SUA MELHOR VERSÃO",
    legenda: "Bem-vindo ao K-TP Projeto Transformação. O método definitivo para sua melhor versão.",
    generoVoz: "masculino"
  },
  { 
    t: "4 FASES DO PROJETO", 
    lista: ["1. OFF SEASON", "2. BULKING", "3. MAINTENANCE", "4. CUTTING"],
    legenda: "Conheça as quatro fases essenciais: Off Season, Bulking, Maintenance e Cutting.",
    generoVoz: "feminino"
  },
  { 
    t: "4 SEMANAS DO MÉTODO", 
    lista: ["SEMANA 1: MANUTENÇÃO", "SEMANA 2: RESISTÊNCIA", "SEMANA 3: FORÇA", "SEMANA 4: HIPERTROFIA"],
    legenda: "Estrutura semanal planejada para evolução contínua e segura.",
    generoVoz: "masculino"
  },
  { 
    t: "NOSSOS OBJETIVOS", 
    lista: ["GANHO DE PESO", "EMAGRECIMENTO", "DEFINIÇÃO MUSCULAR", "SAÚDE", "CONDICIONAMENTO FÍSICO", "HIPERTROFIA", "REABILITAÇÃO FÍSICA"],
    legenda: "Focado em emagrecimento, hipertrofia, saúde e condicionamento físico completo.",
    generoVoz: "feminino"
  },
  { 
    t: "CRONOGRAMA", 
    tabela: [["PERÍODO", "ETAPA"], ["JANEIRO A NOVEMBRO", "EXECUÇÃO E EVOLUÇÃO"], ["DEZEMBRO", "CONCLUSÃO E RESULTADOS FINAIS"]],
    legenda: "Cronograma anual de janeiro a dezembro com acompanhamento de ponta a ponta.",
    generoVoz: "masculino"
  },
  { 
    t: "PARA TODOS", 
    lista: ["CRIANÇAS 10+", "JOVENS", "ADULTOS", "IDOSOS", "ATLETAS", "<span class='destaque'>TREINO 100% PERSONALIZADO</span>"],
    legenda: "Atendimento especializado para crianças a partir de 10 anos, adultos e atletas.",
    generoVoz: "feminino"
  },
  {
    t: "PLANOS E FREQUÊNCIA",
    tabela: [
      ["PLANO", "FREQUÊNCIA", "MODALIDADE"],
      ["AULA AVULSA", "1X NA SEMANA", "PRESENCIAL OU ONLINE"],
      ["MENSAL", "2X NA SEMANA", "PRESENCIAL OU ONLINE"],
      ["MENSAL", "3X NA SEMANA", "PRESENCIAL OU ONLINE"],
      ["MENSAL", "4X NA SEMANA", "PRESENCIAL OU ONLINE"],
      ["MENSAL VIP", "5X NA SEMANA", "PRESENCIAL OU ONLINE"]
    ],
    legenda: "Escolha o plano ideal para sua rotina com modalidades presenciais ou online.",
    generoVoz: "masculino"
  },
  { 
    t: "FUNCIONAMENTO", 
    tabela: [["TIPO", "DIAS"], ["TREINO GUIADO", "SEGUNDA A SEXTA-FEIRA"], ["ACADEMIA EXCLUSIVA 24H", "DOMINGO A DOMINGO"]],
    legenda: "Treinos guiados de segunda a sexta e acesso à academia exclusiva 24 horas.",
    generoVoz: "feminino"
  },
  { 
    t: "HORÁRIOS DISPONÍVEIS", 
    tabela: [["MANHÃ", "NOITE / MADRUGADA", "VAGAS"], ["06H 07H 08H 09H 10H", "16H ÀS 05H", "<span class='destaque-red'>7 VAGAS POR HORÁRIO</span>"]],
    legenda: "Horários flexíveis pela manhã, noite e madrugada. Apenas 7 vagas por horário.",
    generoVoz: "masculino"
  },
  { 
    t: "CHEGOU SUA VEZ", 
    s: "PARE DE ADIAR", 
    p: "<span class='destaque'>K-TP</span> - SEU CORPO, NOSSA MISSÃO<br>O difícil é começar, continuar é um processo.", 
    vagas: true,
    legenda: "O difícil é começar. Continuar é um processo. Participe do K-TP Projeto Transformação!",
    generoVoz: "duo"
  },
];

let current = 0;
let timer;
let subTimer;
let isPlaying = true;
let somAtivo = true;
const container = document.getElementById('slides');
const whoosh = document.getElementById('whoosh');
const counterEl = document.getElementById('slideCounter');
const progressBar = document.getElementById('progressBar');
const legendaEl = document.getElementById('cinemaLegendaTexto');

const synth = window.speechSynthesis;
let vozesDisponiveis = [];

function carregarVozes() {
  if(synth) vozesDisponiveis = synth.getVoices();
}
if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = carregarVozes;
}
carregarVozes();

function obterVoz(genero) {
  let ptVozes = vozesDisponiveis.filter(v => v.lang.includes('pt') || v.lang.includes('PT'));
  if(ptVozes.length === 0) ptVozes = vozesDisponiveis;

  if (genero === "feminino") {
    return ptVozes.find(v => v.name.toLowerCase().includes('maria') || v.name.toLowerCase().includes('luciana') || v.name.toLowerCase().includes('helena') || v.name.toLowerCase().includes('female')) || ptVozes[0];
  } else {
    return ptVozes.find(v => v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('antonio') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david')) || ptVozes[1] || ptVozes[0];
  }
}

function falarTexto(index) {
  if (!somAtivo || !synth) return;
  synth.cancel();
  const slide = slides[index];

  if (slide.generoVoz === "duo") {
    // Clímax final com as duas vozes combinadas conforme solicitado
    let utter1 = new SpeechSynthesisUtterance("O difícil é começar.");
    utter1.voice = obterVoz("feminino");
    utter1.rate = 1.0;
    utter1.lang = 'pt-BR';

    let utter2 = new SpeechSynthesisUtterance("Continuar é um processo.");
    utter2.voice = obterVoz("masculino");
    utter2.rate = 1.0;
    utter2.lang = 'pt-BR';

    let utter3 = new SpeechSynthesisUtterance("Participe do K-TP Projeto Transformação!");
    utter3.voice = obterVoz("feminino");
    utter3.rate = 1.05;
    utter3.lang = 'pt-BR';

    synth.speak(utter1);
    synth.speak(utter2);
    synth.speak(utter3);
  } else {
    let utter = new SpeechSynthesisUtterance(slide.legenda);
    utter.voice = obterVoz(slide.generoVoz);
    utter.rate = 1.02;
    utter.lang = 'pt-BR';
    synth.speak(utter);
  }
}

function renderSlide(i) {
  const slide = slides[i];
  let content = `<h1>${slide.t}</h1>`;
  if(slide.s) content += `<h2 style="font-size:clamp(15px, 3.5vw, 28px);color:#00ffff;margin-bottom:6px;width:100%;text-align:center;text-shadow:0 0 15px #00ffff;">${slide.s}</h2>`;

  if(slide.lista) {
    content += `<div class="sub-list">`;
    slide.lista.forEach(item => content += `<div class="sub-item">${item}</div>`);
    content += `</div>`;
  }
  if(slide.tabela) {
    content += `<table>`;
    slide.tabela.forEach((row, idx) => {
      content += `<tr>`;
      row.forEach(cell => content += idx===0? `<th>${cell}</th>` : `<td>${cell}</td>`);
      content += `</tr>`;
    });
    content += `</table>`;
  }
  if(slide.p) content += `<p style="font-size:clamp(14px, 3.2vw, 24px);margin-top:8px;text-align:center;line-height:1.3;">${slide.p}</p>`;
  if(slide.vagas) content += `<p class="destaque-red" style="font-size:clamp(15px, 3.5vw, 28px);margin-top:8px;text-align:center;">RESTAM APENAS 7 VAGAS!</p>`;

  container.innerHTML = `<div class="slide active">${content}</div>`;
  legendaEl.innerText = slide.legenda;
  
  counterEl.innerText = `${i + 1} / ${slides.length}`;
  progressBar.style.animation = 'none';
  progressBar.offsetHeight;
  progressBar.style.animation = 'load 6s linear forwards';

  falarTexto(i);
  startSubAnimation();
}

function startSubAnimation(){
  clearInterval(subTimer);
  const items = document.querySelectorAll('.sub-item');
  if(items.length === 0) return;
  let idx = 0;
  const timePerItem = 6000 / items.length;
  items.forEach(it => it.classList.remove('active'));
  items[0].classList.add('active');
  subTimer = setInterval(()=>{
    items.forEach(it => it.classList.remove('active'));
    idx = (idx + 1) % items.length;
    items[idx].classList.add('active');
  }, timePerItem);
}

function goToSlide(n) {
  clearInterval(timer); clearInterval(subTimer);
  if(synth) synth.cancel();
  const prev = container.querySelector('.slide.active');
  if(prev) prev.classList.add('exit');
  whoosh.currentTime = 0; whoosh.play().catch(() => {});
  setTimeout(()=> {
    current = n;
    renderSlide(current);
    if(isPlaying) startTimer();
  }, 600);
}

function nextSlide() { goToSlide((current + 1) % slides.length); }
function prevSlide() { goToSlide((current - 1 + slides.length) % slides.length); }

function startTimer() { 
  clearInterval(timer);
  timer = setInterval(nextSlide, 6000); 
}

function togglePlayPause() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('btnPlayPause');
  if(isPlaying) {
    btn.innerText = "⏸ PAUSAR";
    startTimer();
  } else {
    btn.innerText = "▶ PLAY";
    clearInterval(timer);
    clearInterval(subTimer);
    if(synth) synth.cancel();
  }
}

function toggleSom() {
  somAtivo = !somAtivo;
  const btnSom = document.getElementById('btnSom');
  if(somAtivo) {
    btnSom.innerText = "🔊 SOM: LIGADO";
    falarTexto(current);
  } else {
    btnSom.innerText = "🔇 SOM: DESLIGADO";
    if(synth) synth.cancel();
  }
}

document.body.addEventListener('click', (e)=>{
  if(!e.target.closest('.footer-controls') && !e.target.closest('.btn') && !e.target.closest('.btn-participar')) {
    nextSlide();
  }
});

renderSlide(0);
startTimer();
</script>

</body>
</html>
