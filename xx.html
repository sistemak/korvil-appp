const fs = require('fs');
const path = require('path');

function criarArquivo(nome, conteudo) {
  const dir = path.dirname(nome);
  if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });
  fs.writeFileSync(nome, conteudo, 'utf8');
